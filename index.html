<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Priluck</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-gray-50 pb-20">

    <!-- Top Header -->
    <div class="bg-indigo-900 text-white p-6 rounded-b-3xl">
        <div class="flex justify-between items-center mb-4">
            <i class="fa-solid fa-bars"></i>
            <div class="text-center">
                <h1 class="text-xl font-bold">প্রিলাক</h1>
                <p class="text-xs opacity-70">Task করুন, Earn করুন</p>
            </div>
            <i class="fa-solid fa-bell"></i>
        </div>
    </div>

    <!-- Stats Cards -->
    <div class="grid grid-cols-3 gap-2 px-4 -mt-8">
        <div class="bg-blue-600 p-3 rounded-2xl text-white text-center shadow-lg"><p class="text-[9px]">আজকের আয়</p><p class="font-bold">₹142.50</p></div>
        <div class="bg-orange-500 p-3 rounded-2xl text-white text-center shadow-lg"><p class="text-[9px]">আজকের টাস্ক</p><p class="font-bold">8/15</p></div>
        <div class="bg-green-500 p-3 rounded-2xl text-white text-center shadow-lg"><p class="text-[9px]">সাকসেস রেট</p><p class="font-bold">92%</p></div>
    </div>

    <!-- Streak Section -->
    <div class="bg-white mx-4 mt-6 p-4 rounded-3xl shadow-sm">
        <p class="font-bold text-sm mb-3">ধারাবাহিকতা বজায় রাখুন!</p>
        <div class="flex justify-between items-center text-center">
            <div class="flex flex-col items-center"><div class="w-8 h-8 rounded-full bg-blue-100 flex items-center justify-center text-blue-600">✓</div><span class="text-[10px]">১ দিন</span></div>
            <div class="flex flex-col items-center"><div class="w-8 h-8 rounded-full bg-blue-100 flex items-center justify-center text-blue-600">✓</div><span class="text-[10px]">২ দিন</span></div>
            <div class="flex flex-col items-center"><div class="w-8 h-8 rounded-full bg-blue-100 flex items-center justify-center text-blue-600">✓</div><span class="text-[10px]">৩ দিন</span></div>
            <div class="flex flex-col items-center"><div class="w-8 h-8 rounded-full bg-blue-100 flex items-center justify-center text-blue-600">✓</div><span class="text-[10px]">৪ দিন</span></div>
            <div class="flex flex-col items-center"><div class="w-8 h-8 rounded-full bg-blue-100 flex items-center justify-center text-blue-600">✓</div><span class="text-[10px]">৫ দিন</span></div>
            <div class="flex flex-col items-center"><div class="w-8 h-8 rounded-full border border-gray-300 flex items-center justify-center">6</div><span class="text-[10px]">৬ দিন</span></div>
            <div class="flex flex-col items-center"><div class="w-8 h-8 rounded-full border border-gray-300 flex items-center justify-center">🔥</div><span class="text-[10px]">৭ দিন</span></div>
        </div>
    </div>

    <!-- Middle Three Icons -->
    <div class="grid grid-cols-3 gap-2 px-4 mt-6">
        <div class="bg-white p-3 rounded-2xl text-center shadow-sm"><i class="fa-solid fa-gift text-pink-500 mb-1"></i><p class="text-[9px]">অফার</p></div>
        <div class="bg-white p-3 rounded-2xl text-center shadow-sm"><i class="fa-solid fa-chart-pie text-blue-500 mb-1"></i><p class="text-[9px]">পারফরম্যান্স</p></div>
        <div class="bg-white p-3 rounded-2xl text-center shadow-sm"><i class="fa-solid fa-fire text-orange-500 mb-1"></i><p class="text-[9px]">স্ট্রিক</p></div>
    </div>

    <!-- Task List -->
    <div class="mx-4 mt-6">
        <h2 class="font-bold mb-3">আজকের Top Tasks</h2>
        <div class="bg-white p-4 rounded-2xl mb-3 flex justify-between items-center shadow-sm">
            <div class="flex items-center gap-3"><i class="fa-brands fa-google text-2xl"></i><div><p class="font-bold text-sm">গুগল সার্চ করুন</p><p class="text-[10px] text-gray-500">২ মিনিট</p></div></div>
            <button class="bg-indigo-900 text-white px-4 py-1 rounded-full text-xs">শুরু করুন</button>
        </div>
    </div>

    <!-- Refer -->
    <div class="bg-gradient-to-r from-indigo-700 to-purple-800 mx-4 mt-4 p-5 rounded-2xl text-white flex justify-between items-center">
        <div><p class="font-bold">বন্ধুকে Refer করুন</p><p class="text-[10px]">৪০টি টাস্ক করলে পাবেন ৫০ টাকা</p></div>
        <button class="bg-white text-indigo-900 px-3 py-1 rounded-full text-xs font-bold">Refer করুন ></button>
    </div>

    <!-- Nav -->
    <div class="fixed bottom-0 w-full bg-white border-t p-4 flex justify-around">
        <i class="fa-solid fa-house text-indigo-900"></i><i class="fa-solid fa-trophy text-gray-400"></i><i class="fa-solid fa-wallet text-gray-400"></i><i class="fa-solid fa-user text-gray-400"></i>
    </div>
</body>
</html>
