<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Priluck Premium</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #F8FAFC; }
        .glass-card { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.2); }
    </style>
</head>
<body class="pb-24">

    <!-- Header -->
    <div class="bg-gradient-to-br from-indigo-800 to-blue-900 text-white p-6 pb-20 rounded-b-[2rem] shadow-2xl">
        <div class="flex justify-between items-center">
            <div class="p-2 bg-white/10 rounded-xl"><i class="fa-solid fa-bars text-xl"></i></div>
            <div class="text-center">
                <h1 class="text-2xl font-extrabold tracking-tight">প্রিলাক</h1>
                <p class="text-xs opacity-70">Task করুন, Earn করুন</p>
            </div>
            <div class="p-2 bg-white/10 rounded-xl"><i class="fa-solid fa-bell text-xl"></i></div>
        </div>
    </div>

    <!-- Stats Grid -->
    <div class="grid grid-cols-3 gap-3 px-4 -mt-12">
        <div class="bg-gradient-to-br from-blue-500 to-blue-700 p-3 rounded-2xl shadow-lg text-white text-center">
            <p class="text-[9px] opacity-80 uppercase tracking-widest">আয়</p>
            <p class="font-bold text-sm my-1">₹142.50</p>
        </div>
        <div class="bg-gradient-to-br from-orange-400 to-orange-600 p-3 rounded-2xl shadow-lg text-white text-center">
            <p class="text-[9px] opacity-80 uppercase tracking-widest">টাস্ক</p>
            <p class="font-bold text-sm my-1">8/15</p>
        </div>
        <div class="bg-gradient-to-br from-emerald-400 to-emerald-600 p-3 rounded-2xl shadow-lg text-white text-center">
            <p class="text-[9px] opacity-80 uppercase tracking-widest">সাকসেস</p>
            <p class="font-bold text-sm my-1">92%</p>
        </div>
    </div>

    <!-- Refer Banner (Premium) -->
    <div class="relative mx-4 mt-8 p-6 rounded-3xl bg-gradient-to-r from-indigo-700 to-purple-800 text-white overflow-hidden shadow-2xl">
        <div class="relative z-10">
            <h2 class="text-lg font-bold">বন্ধুকে Refer করুন</h2>
            <p class="text-xs opacity-80 mb-4">৪০টি টাস্ক করলে পাবেন ৫০ টাকা</p>
            <button class="bg-white text-indigo-900 font-bold px-5 py-2 rounded-full text-xs hover:scale-105 transition-transform">Refer করুন →</button>
        </div>
        <div class="absolute right-0 top-0 opacity-20 transform translate-x-4 -translate-y-4">
            <i class="fa-solid fa-gift text-9xl"></i>
        </div>
    </div>

    <!-- Task List -->
    <div class="mx-4 mt-6">
        <h3 class="font-bold text-gray-800 mb-4">আজকের Top Tasks</h3>
        <div class="glass-card p-4 rounded-3xl shadow-sm mb-3 flex items-center justify-between">
            <div class="flex items-center gap-4">
                <div class="w-12 h-12 bg-blue-100 rounded-2xl flex items-center justify-center text-blue-600 text-xl"><i class="fa-brands fa-google"></i></div>
                <div>
                    <p class="font-semibold text-gray-800">গুগল সার্চ করুন</p>
                    <p class="text-xs text-gray-500">2 মিনিট • ₹8</p>
                </div>
            </div>
            <button class="bg-indigo-600 text-white px-4 py-2 rounded-xl font-bold text-xs">শুরু</button>
        </div>
    </div>

    <!-- Bottom Nav -->
    <div class="fixed bottom-0 w-full bg-white border-t border-gray-100 flex justify-around p-4 rounded-t-3xl shadow-[0_-5px_20px_rgba(0,0,0,0.05)]">
        <i class="fa-solid fa-house text-indigo-700"></i>
        <i class="fa-solid fa-trophy text-gray-400"></i>
        <i class="fa-solid fa-wallet text-gray-400"></i>
        <i class="fa-solid fa-user text-gray-400"></i>
    </div>
</body>
</html>
